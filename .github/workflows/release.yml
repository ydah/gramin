name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0 # zizmor: ignore[adhoc-packages] npm is intentionally pinned for release publishing
      - name: Require the CLI release tag
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "Run this workflow from a version tag."
            exit 1
          fi
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$RELEASE_REF_NAME" != "v$cli_version" ]; then
            echo "Expected tag v$cli_version, got $RELEASE_REF_NAME."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-corpus.mjs
      - run: pnpm release:check
      - name: Publish unpublished versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.dist-tag }}
        run: node scripts/publish-release.mjs --tag "$NPM_DIST_TAG"
