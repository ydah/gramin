name: Grammar feature review

on:
  pull_request:
    paths:
      - examples/action-demo/**
      - .github/workflows/grammar-features.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          files: examples/action-demo/sample.y
          frontend: yacc-family
          analysis: lr
