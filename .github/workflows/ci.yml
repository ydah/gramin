name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    env:
      GRAMIN_REQUIRE_CORPUS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-corpus.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:cross-format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm benchmark:corpus
      - run: node scripts/pack-release.mjs
      - run: node scripts/smoke-release.mjs
