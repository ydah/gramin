name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GRAMIN_REQUIRE_CORPUS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/fetch-corpus.sh
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:cross-format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm benchmark:corpus
      - run: node scripts/pack-release.mjs
      - run: node scripts/smoke-release.mjs
