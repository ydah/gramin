name: gramin
description: Analyze grammar files, compare a merge-base baseline, and report feature changes
author: Yudai Takada

inputs:
  files:
    description: Newline-separated grammar file paths
    required: true
  baseline:
    description: Features JSON baseline override (otherwise use the PR or push merge-base)
    required: false
  frontend:
    description: Explicit frontend identifier
    required: false
  dialect:
    description: Grammar dialect
    required: false
  source-root:
    description: Workspace-relative root used to normalize source file names
    required: false
    default: "."
  analysis:
    description: Optional analysis mode (lr)
    required: false
  comment:
    description: Create or update the feature diff comment on pull requests
    required: false
    default: "true"
  fail-on:
    description: Diagnostic threshold (error, warning, or none)
    required: false
    default: error
  fail-on-regression:
    description: Fail when tracked feature regressions are found against the baseline
    required: false
    default: "false"
  output:
    description: SARIF output path
    required: false
    default: gramin.sarif

outputs:
  report:
    description: Path to the generated SARIF report
    value: ${{ steps.analyze.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false
    - id: analyze
      shell: bash
      env:
        GRAMIN_FILES: ${{ inputs.files }}
        GRAMIN_BASELINE: ${{ inputs.baseline }}
        GRAMIN_FRONTEND: ${{ inputs.frontend }}
        GRAMIN_DIALECT: ${{ inputs.dialect }}
        GRAMIN_SOURCE_ROOT: ${{ inputs.source-root }}
        GRAMIN_ANALYSIS: ${{ inputs.analysis }}
        GRAMIN_COMMENT: ${{ inputs.comment }}
        GRAMIN_FAIL_ON: ${{ inputs.fail-on }}
        GRAMIN_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        GRAMIN_OUTPUT: ${{ inputs.output }}
        GRAMIN_CLI_PACKAGE: "@gramin/cli@1.0.0"
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/scripts/action-runner.mjs"
