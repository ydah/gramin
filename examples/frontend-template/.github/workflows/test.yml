name: Frontend contract

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ydah/gramin
          ref: c4904b79c0808c45d126f41b364f994b85ad89d1
          path: .gramin
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          package_json_file: .gramin/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python3 -m unittest discover -s tests
      - run: pnpm --dir .gramin install --frozen-lockfile
      - run: pnpm --dir .gramin build
      - run: node .gramin/packages/cli/dist/bin.js frontend-test fixtures/sample.bnf --frontend-cmd ./bin/gramin-example-frontend
